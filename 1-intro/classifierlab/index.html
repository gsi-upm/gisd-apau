<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassifierLab</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="#"><b>Classifier</b><span>Lab</span></a><small>Intelligent Systems Group · UPM</small><select id="language" aria-label="Idioma / Language" style="width:auto;margin-left:auto"><option value="es">🇪🇸 Español</option><option value="en">🇬🇧 English</option></select></header><main><section class="intro"><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="intro"></p></section><nav id="tabs" class="tabs"></nav><div class="grid"><aside class="card controls"><h2 id="problem"></h2><label id="dataLabel" for="data"></label><select id="data"><option value=".05"></option><option value=".2"></option><option value=".5"></option></select><label id="modelLabel" for="model"></label><select id="model"><option value="useful"></option><option value="lazy"></option><option value="random"></option></select><label for="threshold"><span id="thresholdLabel"></span> <output id="thresholdOut"></output></label><input id="threshold" type="range" min="0" max="1" step=".01" value=".5"><p class="help" id="thresholdHelp"></p><button id="labels" class="secondary" aria-pressed="false"></button></aside><section class="card visual"><h2 id="visualTitle"></h2><div class="view"><canvas id="plot" width="720" height="460" role="img"></canvas><div id="matrixStage"></div></div><div id="legend" class="legend"></div><p id="caption" class="help"></p></section><aside class="card metrics"><h2 id="metricsTitle"></h2><div id="metricCards"></div><h3 id="matrixTitle"></h3><div id="matrix"></div><p id="metricHelp" class="help"></p></aside></div><section id="guide" class="card guide"></section><section class="card challenge"><h2 id="challengeTitle"></h2><p id="challengeCopy"></p><button id="save" class="primary"></button><div id="saved" class="saved" style="overflow:auto"></div>
